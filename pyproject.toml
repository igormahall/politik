[project]
name = "politik"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx", "feedparser", "jinja2"]

[project.optional-dependencies]
dev = ["pytest", "pyyaml", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["politik*"]

[tool.setuptools.package-data]
"politik.site" = ["templates/*.html", "*.css", "*.svg"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
order-by-type = false
