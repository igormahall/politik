name: Carga de tema

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Identificador do tema (ex.: caso-master)"
        required: true
      nome:
        description: "Nome do tema (ex.: Caso Master)"
        required: true
      descricao:
        description: "Descrição curta (ex.: Banco Master e Daniel Vorcaro)"
        required: true

permissions:
  contents: write
  id-token: write

concurrency: politik-diario

jobs:
  carga:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Montar linha do tempo com Claude Code
        id: claude
        continue-on-error: true # parou no meio? o que já foi gravado ainda é validado e salvo
        timeout-minutes: 45
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/carga-tema ${{ inputs.slug }} "${{ inputs.nome }}" "${{ inputs.descricao }}"'
          claude_args: |
            --max-turns 60
            --allowedTools "Read(data/**),Read(editorial/**),Edit(data/temas/**),Glob,WebSearch,WebFetch"

      - name: Restaurar código (o Claude só pode mudar data/temas)
        if: always()
        run: git checkout HEAD -- politik config editorial .claude .github pyproject.toml

      - name: Validar tema
        id: validar
        if: always()
        run: python -m politik validar-tema --slug "$SLUG"

      - name: Salvar tema
        if: always() && steps.validar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "politik-bot"
          git config user.email "politik-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add "data/temas/$SLUG.json"
          git diff --cached --quiet && exit 0
          git commit -m "tema: $SLUG (carga)"
          git pull --rebase origin "${{ github.ref_name }}" && git push
