name: Politik diário

on:
  # O gatilho de verdade é o agendador externo (cron-job.org), que chama a API às 6h13 e às 8h13 de Manaus
  # com agendado=true. O schedule do GitHub nunca disparou neste repositório (docs/OPERACAO.md) e fica só
  # de reserva, nos mesmos horários: uma execução automática que acha o dia pronto não faz nada.
  schedule:
    - cron: "13 10 * * *" # 10:13 UTC = 06:13 em Manaus
    - cron: "13 12 * * *" # repescagem, 08:13 em Manaus
  workflow_dispatch:
    inputs:
      data:
        description: "Dia de referência (AAAA-MM-DD). Vazio = ontem."
        required: false
      agendado:
        description: "Disparo automático: se o dia já foi processado, não faz nada."
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: politik-diario

jobs:
  checar:
    runs-on: ubuntu-24.04
    outputs:
      rodar: ${{ steps.checar.outputs.rodar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }} # ponta atual do branch, com o commit de uma execução anterior
          persist-credentials: false
      - id: checar
        env:
          EVENTO: ${{ github.event_name }}
          AGENDADO: ${{ inputs.agendado }}
        run: |
          D=$(PYTHONPATH=. python3 -c "from politik.datas import dia_de_referencia as d; print(d())")
          if { [ "$EVENTO" = schedule ] || [ "$AGENDADO" = true ]; } && [ -f "data/diario/$D.json" ]; then
            echo "$D já foi processado; nada a fazer"
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

  diario:
    needs: checar
    if: needs.checar.outputs.rodar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # o token de push só entra no passo de commit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Endereço do site
        # não vem de github.event.repository: execução agendada não tem payload, e o link sairia quebrado
        run: echo "POLITIK_BASE_URL=https://$GITHUB_REPOSITORY_OWNER.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Dia de referência
        env:
          DATA_INPUT: ${{ inputs.data }}
        run: |
          D="$DATA_INPUT"
          if [ -z "$D" ]; then D=$(python -c "from politik.datas import dia_de_referencia as d; print(d())"); fi
          echo "D=$D" >> "$GITHUB_ENV"

      - name: Coletar
        run: python -m politik coletar --data "$D"
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}

      - name: Filtrar
        run: python -m politik filtrar --data "$D"

      - name: Guardar selecionados
        # é a lista do que foi coletado hoje; a validação das fontes do Mundo confia nela, então o Claude não pode mexer.
        # A fila de pendentes vira destaque amanhã: também não.
        run: |
          cp "data/selecionados/$D.json" "$RUNNER_TEMP/selecionados.json"
          cp data/pendentes.json "$RUNNER_TEMP/pendentes.json"

      - name: Traduzir com Claude Code
        id: claude
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/traduzir ${{ env.D }}"
          # o Claude só lê data/ e editorial/ e só escreve em data/
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 80
            --allowedTools "Read(data/**),Read(editorial/**),Edit(data/**),Glob"

      - name: Registrar uso da cota
        if: always()
        run: |
          git checkout HEAD -- data/uso.jsonl # só o pipeline escreve no registro
          python -m politik registrar-uso --arquivo "${{ steps.claude.outputs.execution_file }}" --data "$D"

      - name: Restaurar código (o Claude só pode mudar data/)
        if: always()
        run: |
          git checkout HEAD -- politik config editorial .claude .github pyproject.toml
          cp "$RUNNER_TEMP/selecionados.json" "data/selecionados/$D.json"
          cp "$RUNNER_TEMP/pendentes.json" data/pendentes.json

      - name: Validar
        id: validar
        run: python -m politik validar --data "$D"

      - name: Gerar site
        run: python -m politik site --saida site_build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        continue-on-error: true
        with:
          path: site_build
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Enviar no Telegram
        if: always() && steps.validar.outcome == 'success'
        run: python -m politik enviar --data "$D"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Carrossel do Instagram
        if: always() && steps.validar.outcome == 'success'
        continue-on-error: true # o carrossel nunca derruba o boletim nem o commit do histórico
        timeout-minutes: 10
        run: |
          pip install -e .[carrossel]
          playwright install --with-deps chromium
          python -m politik carrossel --data "$D" --saida carrossel_build
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salvar histórico
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDAR: ${{ steps.validar.outcome }}
        run: |
          if [ "$VALIDAR" != "success" ]; then
            # sem validação, nada do que o Claude escreveu vai para o histórico; a repescagem tenta de novo
            git checkout HEAD -- data/fichas data/temas data/mundo data/diario
            git clean -fdq -- data/fichas data/temas data/mundo data/diario
          fi
          git config user.name "politik-bot"
          git config user.email "politik-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "dados: $D"
          for tentativa in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            sleep 5
          done
          exit 1
